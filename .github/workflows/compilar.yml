name: Compilar Reino Animal - Fabric 1.21.1

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Compilar el mod
        run: gradle --no-daemon build

      - name: Publicar el JAR instalable
        uses: actions/upload-artifact@v4
        with:
          name: Reino-Animal-Fabric-1.21.1
          path: build/libs/reino-animal-1.0.0.jar
          if-no-files-found: error
